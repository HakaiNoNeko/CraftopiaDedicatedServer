name: release
on:
  push:
    tags: ['v*']
    branches: ['release-prep']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: python -m unittest -v
      - run: bash installer/build.sh
      - name: Package
        run: |
          d=craftopia-server-manager; mkdir -p $d dist
          cp craftopia_server.py LICENSE README.md installer/install.sh build/CraftopiaServerChat.dll $d/
          cp -r build/bepinex-linux_x64 $d/bepinex
          tar czf dist/craftopia-server-manager-linux.tar.gz $d
          cp installer/bootstrap.sh dist/install.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: python -m unittest -v
      - run: bash installer/build.sh
      - name: Build exe
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name craftopia-server-manager craftopia_server.py
          ./dist/craftopia-server-manager.exe --version
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v'); if (-not $v -or $v -eq 'main') { $v = '0.0.0' }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" installer\windows.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/CraftopiaServerManager-Setup.exe }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets && sha256sum * > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes --title "${{ github.ref_name }}" *
